name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Prepare app files
        run: |
          mkdir -p build/www
          cp index.html icon-192.png icon-512.png build/www/

      - name: Create Android project (Capacitor)
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Roni Hisab" com.roni.hisab --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          RES=build/android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android-icons/$d.png" "$RES/mipmap-$d/ic_launcher.png"
            cp "android-icons/$d.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

      - name: Build APK
        working-directory: build/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$KS_B64" | base64 -d > ks.p12
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks ks.p12 --ks-key-alias ronihisab --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$GITHUB_WORKSPACE/RoniHisab.apk" aligned.apk
            rm -f ks.p12
          else
            echo "::warning::Signing secrets not set - building a DEBUG APK. Updates may need reinstall."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RoniHisab.apk"
          fi

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Roni Hisab (build ${{ github.run_number }})
          body: Download RoniHisab.apk on your phone and install it.
          files: RoniHisab.apk
          make_latest: true
