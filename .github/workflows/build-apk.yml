name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Prepare app files
        run: |
          mkdir -p build/www
          cp index.html icon-192.png icon-512.png build/www/

      - name: Create Android project (Capacitor)
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap init "Roni Hisab" com.roni.hisab --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon
        run: |
          RES=build/android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android-icons/$d.png" "$RES/mipmap-$d/ic_launcher.png"
            cp "android-icons/$d.png" "$RES/mipmap-$d/ic_launcher_round.png"
          done

      - name: Build APK
        working-directory: build/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          report() {
            echo "::error title=Build step::$1"
            grep -iE "what went wrong|error:|exception|failed|could not|not found|> " build.log | grep -v "^> Task" | head -12 | while read -r l; do echo "::error::$l"; done
            exit 1
          }
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "Signing secrets found - release build"
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || report "gradle assembleRelease failed"
            K=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t'); P=$(printf '%s' "$KS_PASS" | tr -d '\r\n')
            echo "::notice::ANDROID_KEYSTORE length=${#K} (expected 3476), ANDROID_KEY_PASSWORD length=${#P} (expected 24)"
            if [ ${#K} -lt 200 ] && [ ${#P} -gt 200 ]; then echo "::warning::Secrets look swapped - using them the other way round"; T=$K; K=$P; P=$T; fi
            printf '%s' "$K" | base64 -d > ks.p12 2>/dev/null || report "ANDROID_KEYSTORE secret is incomplete (length ${#K}, expected 3476). Re-paste the whole ANDROID_KEYSTORE.txt"
            export KS_PASS="$P"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk 2>&1 | tee build.log || report "zipalign failed"
            "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-key-alias ronihisab --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$GITHUB_WORKSPACE/RoniHisab.apk" aligned.apk 2>&1 | tee build.log || report "apksigner failed - check ANDROID_KEY_PASSWORD secret"
            rm -f ks.p12
          else
            echo "::warning::Signing secrets not set - building a DEBUG APK. Updates may need reinstall."
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || report "gradle assembleDebug failed"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RoniHisab.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/RoniHisab.apk"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Roni Hisab (build ${{ github.run_number }})
          body: Download RoniHisab.apk on your phone and install it.
          files: RoniHisab.apk
          make_latest: true
