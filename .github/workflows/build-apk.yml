name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Prepare app files
        run: |
          mkdir -p build/www
          cp index.html icon-192.png icon-512.png build/www/

      - name: Create Android project (Capacitor)
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6 @capacitor/camera@6 @capawesome-team/capacitor-file-opener@6 @capgo/capacitor-native-biometric@6
          npx cap init "Roni Hisab" com.roni.hisab --web-dir www
          npx cap add android
          npx cap sync android

      - name: Set app icon and biometric permission
        run: |
          RES=build/android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp "android-icons/$d.png"       "$RES/mipmap-$d/ic_launcher.png"
            cp "android-icons/${d}_round.png" "$RES/mipmap-$d/ic_launcher_round.png"
            cp "android-icons/${d}_fg.png"  "$RES/mipmap-$d/ic_launcher_foreground.png"
            cp "android-icons/${d}_bg.png"  "$RES/mipmap-$d/ic_launcher_bg.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          for n in ic_launcher ic_launcher_round; do
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
              '  <background android:drawable="@mipmap/ic_launcher_bg"/>' \
              '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' \
              '</adaptive-icon>' > "$RES/mipmap-anydpi-v26/$n.xml"
          done
          MAN=build/android/app/src/main/AndroidManifest.xml
          grep -q USE_BIOMETRIC "$MAN" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n</manifest>#' "$MAN"
          grep -n "USE_BIOMETRIC" "$MAN"
          # keyboard/focus fix after fingerprint + resize when keyboard opens
          cp android-patch/MainActivity.java build/android/app/src/main/java/com/roni/hisab/MainActivity.java
          grep -q windowSoftInputMode "$MAN" || sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:windowSoftInputMode="adjustResize"#' "$MAN"
          grep -n "windowSoftInputMode" "$MAN" || { echo "::error::windowSoftInputMode not set"; exit 1; }
          grep -n "file-opener" build/android/capacitor.settings.gradle || { echo "::error::file opener plugin not linked"; exit 1; }
          grep -n "capacitor-camera" build/android/capacitor.settings.gradle || { echo "::error::camera plugin not linked"; exit 1; }
          grep -n "fileprovider" "$MAN" || { echo "::error::FileProvider missing (camera needs it)"; exit 1; }
          grep -n "capacitor-app" build/android/capacitor.settings.gradle || { echo "::error::app plugin (back button) not linked"; exit 1; }
          grep -n "NativeBiometric\|native-biometric" build/android/capacitor.settings.gradle || { echo "::error::biometric plugin not linked"; exit 1; }

      - name: Build APK
        working-directory: build/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          report() {
            echo "::error title=Build step::$1"
            grep -iE "what went wrong|error:|exception|failed|could not|not found|> " build.log | grep -v "^> Task" | head -12 | while read -r l; do echo "::error::$l"; done
            exit 1
          }
          chmod +x gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"
          P=$(printf '%s' "$KS_PASS" | tr -d ' \r\n\t')
          export P
          if [ -n "$P" ]; then
            echo "::notice::ANDROID_KEY_PASSWORD length=${#P} (expected 24)"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$GITHUB_WORKSPACE/signing/keystore.enc" -out ks.p12 -pass env:P 2>/dev/null \
              || report "ANDROID_KEY_PASSWORD is wrong (length ${#P}, expected 24). Open ANDROID_KEY_PASSWORD.txt, copy all of it, and paste it as the secret."
            ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || report "gradle assembleRelease failed"
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk 2>&1 | tee build.log || report "zipalign failed"
            "$BT/apksigner" sign --ks ks.p12 --ks-type PKCS12 --ks-key-alias ronihisab --ks-pass env:P --key-pass env:P --out "$GITHUB_WORKSPACE/RoniHisab.apk" aligned.apk 2>&1 | tee build.log || report "apksigner failed"
            rm -f ks.p12
            "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/RoniHisab.apk" | grep -i "certificate DN" || true
          else
            echo "::warning::Signing secrets not set - building a DEBUG APK. Updates may need reinstall."
            ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || report "gradle assembleDebug failed"
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/RoniHisab.apk"
          fi
          ls -la "$GITHUB_WORKSPACE/RoniHisab.apk"

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Roni Hisab (build ${{ github.run_number }})
          body: Download RoniHisab.apk on your phone and install it.
          files: RoniHisab.apk
          make_latest: true
