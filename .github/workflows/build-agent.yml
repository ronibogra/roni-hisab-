name: Build agent exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/build-agent.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install pyinstaller psutil requests pystray Pillow mss
      - name: Build the exe
        working-directory: agent
        run: pyinstaller --noconfirm lailagent.spec
      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lailagent-exe
          path: agent/dist/lailagent.exe
          if-no-files-found: error
      - name: Publish as a downloadable Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete lailagent -y --cleanup-tag 2>$null
          Start-Sleep -Seconds 3
          gh release create lailagent agent/dist/lailagent.exe `
            --title "Laila Group IT Agent (lailagent.exe)" `
            --notes "lailagent.exe built automatically by GitHub Actions. Download it below, put it next to a lailagent.ini (server + agent key), and run it. No Python needed. Includes monitoring, software inventory, and consent-based remote support." `
            --target $env:GITHUB_SHA
